# T1b — restore. Same spec as the source pod; the annotation is what makes CRI-O
# restore instead of starting fresh.
#
#   checkpoint-restore.crio.io/trainer = the checkpoint tar path on the node
#
# No gpu-cr.io/* annotation: this pod must take the application path, not the
# GCR one.
apiVersion: v1
kind: Pod
metadata:
  name: t1b-fluidcr-restore
  namespace: default
  labels: { app: t1b-fluidcr-restore }
  annotations:
    checkpoint-restore.crio.io/trainer: "${CKPT_PATH}"
spec:
  nodeSelector:
    kubernetes.io/hostname: ${TARGET_NODE}
  restartPolicy: Never
  containers:
    - name: trainer
      image: pytorch/pytorch:2.4.0-cuda12.1-cudnn9-runtime
      env:
        - name: FLUIDCR_CTRL_PORT
          value: "8298"
      resources:
        limits:
          nvidia.com/gpu: "1"
      volumeMounts:
        - { name: workspace,  mountPath: /workspace }
        - { name: checkpoint, mountPath: /checkpoint }
  volumes:
    - { name: workspace,  configMap: { name: t1b-train-script } }
    - { name: checkpoint, emptyDir: {} }
