# T1 — FluidCR source workload.
#
# !!! FILL IN BEFORE RUNNING !!!
#   FLUIDCR_IMAGE  — the FluidCR-enabled training image used in the FluidCR setup
#   the command/args below must match how FluidCR expects to be driven
#     (import hook + REST listener, SIGUSR1-triggered state_dict dump)
#
# The point of this test is NOT FluidCR itself — it is whether the GCR patches
# merged into the CRI-O fork changed FluidCR's behaviour. So this pod should be
# as close as possible to the one that worked BEFORE the merge.
apiVersion: v1
kind: Pod
metadata:
  name: t1-fluidcr-src
  namespace: default
  labels: { app: t1-fluidcr-src }
spec:
  nodeSelector:
    kubernetes.io/hostname: ${TARGET_NODE}
  restartPolicy: Never
  containers:
    - name: cuda-app
      image: ${FLUIDCR_IMAGE}
      resources:
        limits:
          nvidia.com/gpu: "1"
      # volumeMounts / env: copy verbatim from the working pre-merge FluidCR pod.
